name: Update Dzen RSS

on:
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-dzen-rss.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dzen-rss-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Dzen discovery source
        run: node scripts/check-dzen-discovery.mjs

      - name: Commit Dzen discovery check
        run: |
          if [ -z "$(git status --porcelain -- dzen-discovery-check.json)" ]; then
            echo "No Dzen discovery check changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dzen-discovery-check.json
            git commit -m "Update Dzen discovery check"
            git push
          fi

      - name: Build RSS feed
        run: npm run update-feed

      - name: Commit feed updates
        run: |
          if git diff --quiet -- feed.xml state.json assets; then
            echo "No feed changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml state.json assets
            git commit -m "Update Dzen RSS"
            git push
          fi

      - name: Verify Telegram connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@kontrastyepox'
        run: node scripts/verify-telegram.mjs

      - name: Commit Telegram check
        run: |
          if [ -z "$(git status --porcelain -- telegram-check.json)" ]; then
            echo "No Telegram check changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add telegram-check.json
            git commit -m "Update Telegram connection check"
            git push
          fi

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@kontrastyepox'
        run: npm run publish-telegram

      - name: Commit Telegram state
        run: |
          if git diff --quiet -- telegram-state.json; then
            echo "No Telegram state changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add telegram-state.json
            git commit -m "Update Telegram publish state"
            git push
          fi

      - name: Verify VK connection and photo upload
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '240532552'
        run: node scripts/verify-vk.mjs

      - name: Commit VK check
        run: |
          if [ -z "$(git status --porcelain -- vk-check.json)" ]; then
            echo "No VK check changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vk-check.json
            git commit -m "Update VK connection check"
            git push
          fi

      - name: Publish to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '240532552'
        run: npm run publish-vk

      - name: Commit VK state
        run: |
          if git diff --quiet -- vk-state.json; then
            echo "No VK state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-state.json
          git commit -m "Update VK publish state"
          git push
