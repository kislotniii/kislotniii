name: Verify VK Only

on:
  push:
    paths:
      - '.github/workflows/verify-vk-only.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify VK token and photo upload
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '240532552'
        run: node scripts/verify-vk.mjs

      - name: Save verification result
        run: |
          if [ -z "$(git status --porcelain -- vk-check.json)" ]; then
            echo "No VK check changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-check.json
          git commit -m "Verify VK secret after setup"
          git push
